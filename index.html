<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 站点图标使用本地自托管的 public/favicon.svg（64×64、圆角、专为小尺寸设计）。
         原先指向远程 https://imgs.paiii.cn/logo.svg：那是 200×200 的复杂渐变/高光图，
         缩到 16px 会糊，且每次访问都多一次跨域握手，外域故障时还会没有图标可用。
         Header 的品牌 Logo 仍走 imgs CDN（见 src/lib/constants.ts 与下方 JSON-LD）。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      图片托管域预连接。
      图库首屏要拉几十张跨域图片，而图片是等 React 挂载 + /api/list 返回后才开始请求的，
      握手时间被完全算进首图延迟里。这里在解析 HTML 时就提前完成 DNS + TLS。
      img.static 用裸 preconnect（img 标签是 no-cors 请求，不带 crossorigin）；
      imgs 只用到 logo.svg，dns-prefetch 足够。
    -->
    <link rel="preconnect" href="https://img.static.paiii.cn" />
    <link rel="dns-prefetch" href="https://img.static.paiii.cn" />
    <link rel="dns-prefetch" href="https://imgs.paiii.cn" />

    <!-- Primary Meta Tags -->
    <title>派次元 API - 免费随机图片接口 | 稳定高速图片 API 服务</title>
    <meta name="title" content="派次元 API - 免费随机图片接口 | 稳定高速图片 API 服务" />
    <meta name="description" content="派次元 API 提供免费、稳定、高速的随机图片接口服务。支持标签分类筛选、302 图片直链、JSON 返回、外链图库管理与实时调用统计，由腾讯云 EdgeOne Pages Functions 与 KV 驱动。" />
    <meta name="keywords" content="派次元 API,随机图片API,免费图片接口,随机图片接口,图片API服务,随机图API,外链图床,302重定向,JSON图片API,派立方,腾讯云EdgeOne,EdgeOne Pages,KV" />
    <meta name="author" content="派立方社区" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://t.paiii.cn" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://t.paiii.cn" />
    <meta property="og:title" content="派次元 API - 免费随机图片接口" />
    <meta property="og:description" content="免费、稳定、高速的随机图片 API 服务，支持分类筛选、302 图片直链、JSON 返回与图库管理。" />
    <meta property="og:image" content="https://t.paiii.cn/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="派次元 API · 免费随机图片接口" />
    <meta property="og:site_name" content="派次元 API" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://t.paiii.cn" />
    <meta name="twitter:title" content="派次元 API - 免费随机图片接口" />
    <meta name="twitter:description" content="免费、稳定、高速的随机图片 API 服务。" />
    <meta name="twitter:image" content="https://t.paiii.cn/og.png" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#007AFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "派次元 API",
      "description": "免费、稳定、高速的随机图片 API 服务，支持标签分类、302 图片直链、JSON 返回与图库管理。",
      "url": "https://t.paiii.cn",
      "image": "https://t.paiii.cn/og.png",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CNY"
      },
      "provider": {
        "@type": "Organization",
        "name": "派立方社区",
        "url": "https://paiii.cn",
        "logo": "https://imgs.paiii.cn/logo.svg"
      },
      "featureList": [
        "免费使用",
        "腾讯云 EdgeOne 边缘计算",
        "标签分类筛选",
        "302 图片直链",
        "JSON 格式返回",
        "外链图库管理",
        "实时调用统计"
      ]
    }
    </script>

    <!-- WAF / 防调试脚本：由 imgs CDN 托管，带 disable-devtool-auto 走自动初始化。

         必须 defer，不能同步放在 head：该脚本 17.6 KB 且响应头是 Cache-Control:
         no-cache（每次都回源重取），同步执行会把 HTML 解析卡在这一个第三方请求上，
         首屏渲染完全取决于 imgs 域名的响应速度 —— 它慢或挂，整站就白屏。

         defer 对它也是语义上更正确的时机：脚本内部靠
         `document.querySelector("[disable-devtool-auto]")` 找自己那个标签读配置，
         defer 保证 HTML 解析完毕、元素必然已存在（同步 head 里反而是碰运气）。
         已确认脚本不含 document.write / document.currentScript，可安全延迟。 -->
    <script defer disable-devtool-auto src='https://imgs.paiii.cn/waf/gbts.js'></script>
  </head>

  <body>
    <div id="root">
      <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8f7f3;color:#15171f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
        <section style="max-width:560px;width:100%;border:2px solid #15171f;border-radius:20px;background:#ffffff;padding:28px;box-shadow:6px 6px 0 0 #15171f;text-align:center;">
          <p style="margin:0 0 8px;color:#007AFF;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;">派次元 API</p>
          <h1 style="margin:0 0 12px;font-size:28px;line-height:1.2;">页面正在加载</h1>
          <p style="margin:0;color:#5c5b54;line-height:1.7;">如果长时间停留在这里，请刷新页面或检查网络资源是否被拦截。</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
